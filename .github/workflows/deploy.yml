name: deploy

# Build the image (both sites) and roll it out. Only main deploys; a PR builds so that a
# broken Dockerfile is caught before it is merged, but pushes nothing and
# touches no cluster.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".vscode/**"]
  pull_request:
  workflow_dispatch:
  # Daily rebuild: the GitHub activity on gthanasis.com is baked in at build
  # time, so this is what keeps it current.
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CLUSTER_HOSTNAME: k8s.gthanasis.com
  NAMESPACE: portfolio

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA, not just latest: the rollout below then
      # references an immutable image, so "roll back" means re-applying an
      # older tag rather than hoping latest still points where you think.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The contact form's webhook, from a repository variable. Empty means
          # the form falls back to opening the visitor's mail client.
          build-args: |
            NEXT_PUBLIC_CONTACT_ENDPOINT=${{ vars.CONTACT_ENDPOINT }}

      # --- everything below only runs for a real deploy ---

      - name: Set up kubectl
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/setup-kubectl@v5
        with:
          version: v1.34.3

      # The cluster's API is not exposed to the internet. cloudflared opens an
      # authenticated tunnel to it and presents it on localhost; the Access
      # service token is what authorises this runner, since a GitHub runner
      # has no fixed address to allow through a firewall.
      - name: Open a tunnel to the cluster API
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl -sSLo cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared access tcp \
            --hostname "$CLUSTER_HOSTNAME" \
            --url 127.0.0.1:6443 \
            --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" \
            --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET" &
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6443 && echo "tunnel up after ${i}s" && exit 0
            sleep 1
          done
          echo "tunnel did not come up" >&2
          exit 1

      # Points at 127.0.0.1 because that is where the tunnel is listening. The
      # cluster CA still verifies the real API server certificate end to end —
      # the tunnel forwards TCP without terminating TLS, and 127.0.0.1 is in
      # the certificate's SANs.
      - name: Configure kubectl
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA_CERT: ${{ secrets.KUBE_CA_CERT }}
        run: |
          echo "$KUBE_CA_CERT" | base64 -d > ca.crt
          kubectl config set-cluster pilot \
            --server=https://127.0.0.1:6443 --certificate-authority=ca.crt --embed-certs=true
          kubectl config set-credentials ci --token="$KUBE_TOKEN"
          kubectl config set-context pilot --cluster=pilot --user=ci --namespace="$NAMESPACE"
          kubectl config use-context pilot
          rm -f ca.crt

      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cd deploy/k8s
          kubectl kustomize --help >/dev/null
          # Pin the manifests to the image this run just built.
          sed -i "s|newTag: .*|newTag: ${{ github.sha }}|" kustomization.yaml
          cd -
          kubectl apply -k deploy/k8s

      # Fails the workflow if the new pods never become ready, so a broken
      # deploy shows as a red build instead of silently sitting in
      # CrashLoopBackOff. maxUnavailable: 0 means the old version keeps
      # serving throughout.
      - name: Wait for rollout
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: kubectl -n "$NAMESPACE" rollout status deploy/portfolio --timeout=180s

      - name: Show what is running
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: kubectl -n "$NAMESPACE" get pods -o wide || true
