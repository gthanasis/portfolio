apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace itself is deliberately not a resource here. This is applied by
# CI, whose ServiceAccount is scoped to this one namespace and cannot even read
# a Namespace object — including it made every deploy exit non-zero after the
# app had already rolled out fine. The namespace is created once, out of band,
# by infra's scripts/grant-ci-deploy.sh.
namespace: portfolio

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# CI overwrites the tag with the commit SHA (`kustomize edit set image`), so
# every deploy references an immutable image rather than a moving :latest —
# which is what makes a rollback a matter of re-applying an older tag.
images:
  - name: ghcr.io/gthanasis/portfolio
    newTag: latest
