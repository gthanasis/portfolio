# The tunnel's catch-all forwards any hostname it does not route explicitly to
# the nginx ingress controller, so publishing is just this Ingress plus a DNS
# CNAME — no tunnel change.
#
# No TLS block and no cert-manager annotation on purpose: certificates
# terminate at Cloudflare, and the tunnel speaks plain HTTP to the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
spec:
  ingressClassName: nginx
  # Both hostnames serve the same CV. The apex used to point at the old
  # DigitalOcean droplet, where it answered nothing useful — it did not even
  # have a certificate covering the bare domain, so it failed TLS outright.
  rules:
    - host: gthanasis.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
    - host: cv.gthanasis.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
