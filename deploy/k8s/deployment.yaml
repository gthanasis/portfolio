apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
spec:
  # Two on a single-node cluster is not redundancy — it is so a rolling
  # update never has zero serving pods. maxUnavailable: 0 below is what
  # actually makes the deploy seamless.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  template:
    metadata:
      labels:
        # Alloy turns this into the `app` label on every log line, which is
        # how these logs are separated from other apps in Grafana.
        app.kubernetes.io/name: portfolio
    spec:
      containers:
        - name: portfolio
          # Replaced per-deploy by kustomize; this default is only what you
          # get running `kubectl apply -k` by hand.
          image: ghcr.io/gthanasis/portfolio:latest
          ports:
            - name: http
              containerPort: 8080
          # Static files served from memory-cached disk — this is genuinely
          # tiny, and being honest about it leaves the node's headroom for
          # apps that need it.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # nginx writes temp files under /tmp
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      # Spreads the two pods once a second node exists; a no-op until then.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: portfolio
---
# Deliberately permits full disruption, which reads wrong until you count the
# nodes. There is one. Draining it cordons it, so an evicted pod has nowhere
# to reschedule and "keep one pod serving through the drain" is not a thing
# the cluster can do — the node is about to reboot and take both pods with it
# either way.
#
# minAvailable: 1 was the previous value, and on one node it cannot be
# satisfied during a drain: evicting the first pod leaves one healthy and zero
# disruptions allowed, its replacement stays Pending on the cordoned node, and
# the second eviction is refused forever. Two replicas do not help; they move
# the deadlock one eviction later. On 2026-08-28 that held kured in a retry
# loop for 6h41m and left 26 pods Pending cluster-wide, including all of
# monitoring, so nothing was able to report it.
#
# The infra repo now sets kured's drain-timeout and force-reboot, which bounds
# the damage to a five-minute delay per reboot rather than a stranded node.
# This removes the delay too, and stops a PDB that protects nothing from being
# the thing that blocks every drain.
#
# When a second node exists, this goes back to minAvailable: 1 and starts
# doing what its name suggests. The podAntiAffinity above is already waiting
# for that day.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portfolio
  namespace: portfolio
spec:
  maxUnavailable: 100%
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio
