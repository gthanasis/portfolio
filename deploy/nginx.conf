# Serves the built SPA. Deliberately small: TLS, HTTP/2 and compression
# negotiation all happen at Cloudflare, and the cluster's own ingress sits in
# front of this, so there is nothing for it to do but hand back files.

# Access logs as JSON on stdout. Alloy tails container stdout into Loki
# (see gthanasis/infra), and JSON means Grafana can filter on status or path
# with `| json | status >= 500` instead of matching text.

# Alloy reads severity out of each line and labels it, defaulting to "unknown"
# when it finds nothing it recognises. Every line from here was "unknown",
# because an access log has no severity of its own — so the Severity filter and
# the row colouring in Grafana were both dead for this app. Deriving one from
# the status code fixes that, and makes `level="error"` a label match rather
# than a JSON parse over every line.
map $status $log_level {
    default  "info";
    ~^5      "error";
    ~^4      "warn";
}

log_format json_access escape=json
  '{'
    '"time":"$time_iso8601",'
    '"level":"$log_level",'
    '"status":$status,'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    # The connection comes from the ingress controller, so $remote_addr is a
    # pod IP. Cloudflare puts the real visitor address here.
    '"client_ip":"$http_cf_connecting_ip",'
    '"country":"$http_cf_ipcountry",'
    '"host":"$host"'
  '}';

server {
    listen 8080;
    server_name _;

    access_log /dev/stdout json_access;
    error_log  /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes probes, kept out of the logs — otherwise they are the
    # overwhelming majority of lines in Loki and push real traffic out of
    # retention.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed filenames, so they can be cached indefinitely and a deploy
    # invalidates by changing the name.
    location ~* \.(js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or browsers keep loading an old page
    # that references asset filenames the new deploy no longer has.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # BrowserRouter: the client owns the routes, so any unmatched path is a
    # route rather than a missing file and has to return index.html. Without
    # this, refreshing on /about is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
