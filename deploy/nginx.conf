# Serves both static sites, picked by Host. Deliberately small: TLS, HTTP/2 and compression
# negotiation all happen at Cloudflare, and the cluster's own ingress sits in
# front of this, so there is nothing for it to do but hand back files.

# Access logs as JSON on stdout. Alloy tails container stdout into Loki
# (see gthanasis/infra), and JSON means Grafana can filter on status or path
# with `| json | status >= 500` instead of matching text.

# Alloy reads severity out of each line and labels it, defaulting to "unknown"
# when it finds nothing it recognises. Every line from here was "unknown",
# because an access log has no severity of its own — so the Severity filter and
# the row colouring in Grafana were both dead for this app. Deriving one from
# the status code fixes that, and makes `level="error"` a label match rather
# than a JSON parse over every line.
map $status $log_level {
    default  "info";
    ~^5      "error";
    ~^4      "warn";
}

log_format json_access escape=json
  '{'
    '"time":"$time_iso8601",'
    '"level":"$log_level",'
    '"status":$status,'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    # The connection comes from the ingress controller, so $remote_addr is a
    # pod IP. Cloudflare puts the real visitor address here.
    '"client_ip":"$http_cf_connecting_ip",'
    '"country":"$http_cf_ipcountry",'
    '"host":"$host"'
  '}';

# Shared by both sites. Everything is a prebuilt file, so this only decides
# caching and what counts as a missing page.
map $host $site_root {
    default             /usr/share/nginx/site;
    cv.gthanasis.com    /usr/share/nginx/cv;
}

server {
    listen 8080 default_server;
    server_name _;

    access_log /dev/stdout json_access;
    error_log  /dev/stderr warn;

    root $site_root;
    index index.html;

    # Kubernetes probes, kept out of the logs, otherwise they are the
    # overwhelming majority of lines in Loki and push real traffic out of
    # retention.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Next's build output is content-hashed, so it can be cached forever.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Generated link-preview images (/opengraph-image, /blog/<slug>/opengraph-image) have no extension.
    location ~ /opengraph-image$ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type image/png;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Unhashed assets: cache for a day, revalidate after.
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?|txt|xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML must never be stale, or it would reference asset files the new
    # deploy no longer has. Static export writes /page as /page.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
